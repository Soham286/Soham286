name: Daily automated activity log

on:
  # Run once every day at 10:37 AM Pacific time.
  schedule:
    - cron: "37 10 * * *"
      timezone: "America/Los_Angeles"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity-log
  cancel-in-progress: false

jobs:
  update-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update activity log
        shell: bash
        run: |
          mkdir -p activity

          log_file="activity/daily-log.md"
          today="$(TZ=America/Los_Angeles date +'%Y-%m-%d')"
          timestamp="$(TZ=America/Los_Angeles date +'%Y-%m-%d %H:%M:%S %Z')"

          if [[ ! -f "$log_file" ]]; then
            printf "# Automated Daily Activity Log\n\n" > "$log_file"
            printf "Generated automatically by GitHub Actions.\n\n" >> "$log_file"
          fi

          if grep -q -- "^- ${today} " "$log_file"; then
            echo "An entry already exists for ${today}."
          else
            printf -- "- %s\n" "$timestamp" >> "$log_file"
            echo "Added the entry for ${today}."
          fi

      - name: Commit and push
        shell: bash
        run: |
          git add activity/daily-log.md

          if git diff --cached --quiet; then
            echo "No new daily entry to commit."
            exit 0
          fi

          git config user.name "Soham Banerjee"
          git config user.email \
            "${GITHUB_REPOSITORY_OWNER_ID}+${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"

          git commit -m "chore: update daily activity log"
          git push origin HEAD:main
